apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: netflix-api
  template:
    metadata:
      labels:
        app: netflix-api
    spec:
      containers:
        - name: netflix-api
          image: your-dockerhub-username/netflix-api:latest
          ports:
            - containerPort: 3000

